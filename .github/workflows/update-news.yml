# Kumpul berita, tulis ringkasan AI, simpan arkib dan terbitkan ke GitHub Pages.
# Settings → Pages → Source: "GitHub Actions".
# Ringkasan AI: tambah rahsia OPENAI_API_KEY di Settings → Secrets and variables → Actions.
name: Kemas kini berita
on:
  schedule: [{ cron: "*/20 * * * *" }]
  workflow_dispatch:
  repository_dispatch: { types: [kemas-kini] }
  push: { branches: [main], paths-ignore: ["data/**"] }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node build-static.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
          MAX_SUMMARIES_PER_RUN: ${{ vars.MAX_SUMMARIES_PER_RUN }}
          DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - name: Simpan arkib
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/usage.json
          git diff --cached --quiet || (git commit -m "Kemas kini arkib berita" && git pull --rebase --autostash -X ours origin main && git push)
      - uses: actions/upload-pages-artifact@v5
        with: { path: public }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
